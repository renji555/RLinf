defaults:
  - env/libero_10@env.eval
  - _self_
  - override hydra/job_logging: stdout

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

cluster:
  num_nodes: 1
  component_placement:
    env,rollout: all

runner:
  task_type: embodied_eval
  logger:
    log_path: "../results"
    project_name: rlinf
    experiment_name: "libero_10_eval_cosmos3_sglang"
    logger_backends: ["tensorboard"]

  max_epochs: 1
  only_eval: True
  val_check_interval: -1
  save_interval: -1
  resume_dir: null
  ckpt_path: null

env:
  group_name: "EnvGroup"

  eval:
    rollout_epoch: 1
    total_num_envs: 128
    auto_reset: True
    ignore_terminations: True
    max_episode_steps: 512
    max_steps_per_rollout_epoch: 2048
    group_size: 1
    use_fixed_reset_state_ids: True
    use_ordered_reset_state_ids: True
    is_eval: True

    video_cfg:
      save_video: True
      video_base_dir: ${runner.logger.log_path}/video/eval

rollout:

  group_name: "RolloutGroup"
  rollout_backend: "sglang"
  enable_offload: False
  pipeline_stage_num: 2
  return_logprobs: false
  sampling_params:
    do_sample: false
    max_new_tokens: 1

  sglang:
    serving_mode: "embodied"
    http_timeout_s: 600
    http_max_retries: 5
    http_retry_backoff_s: 1.0
    seed: ${rollout.model.seed}
    tensor_parallel_size: 1
    pipeline_parallel_size: 1
    launch_server: true
    launch_router: false
    server_type: embodied
    group_name: SGLangServerGroup
    router_group_name: SGLangRouterGroup
    server:
      model_path: ${rollout.model.model_path}
      backend: sglang
      pipeline_class_name: Cosmos3OmniDiffusersPipeline
      tp_size: ${..tensor_parallel_size}
      num_gpus: 1  # launcher/placement key: should be TP size * PP size * CFG degree * SP degree
      attention_backend: FA  # FA or TORCH_SDPA
      dit_cpu_offload: false
      cfg_parallel_degree: 1
      sp_degree: 1
      batching_max_size: 8

  model:
    # Export the non-EMA SFT net from the same full_weights.pt used by HF eval.
    model_path: /mnt/public2/rhy/docker_dev/update/model/dagger_120/model_diffusers
    # https://github.com/NVIDIA/cosmos-framework/blob/main/cosmos_framework/data/generator/action/normalizer_stats/libero_native_frame_wise_relative_rot6d.json
    action_stats_path: /mnt/public2/rhy/cosmos_rlinf/RLinf/.venv/cosmos-framework/cosmos_framework/data/generator/action/normalizer_stats/libero_native_frame_wise_relative_rot6d.json

    # Preserve the eval model defaults without inheriting the DAgger model config.
    model_type: cosmos3
    checkpoint_format: native
    precision: bf16
    load_to_device: false
    is_lora: false
    ema_enabled: false
    disable_cosmos_parallelism: true
    compile_enabled: false
    keys_to_skip_loading:
    - net_ema.
    - action2llm
    - llm2action
    - action_modality_embed
    - action_pos_embed
    keys_to_select:
    - moe_gen
    - time_embedder
    - vae2llm
    - llm2vae
    - action2llm
    - llm2action
    - action_modality_embed
    lr_multipliers:
      action2llm: 5.0
      llm2action: 5.0
      action_modality_embed: 5.0
    num_action_chunks: 16
    action_dim: 7
    raw_action_dim: 10
    domain_name: libero
    action_mode: policy
    action_view_point: ego_view
    action_normalization: quantile_rot
    size: 320x192
    resolution: '256'
    num_frames: 17
    fps: 20
    action_fps: 20.0
    num_inference_steps: 30
    shift: 10.0
    guidance: 1.5
    seed: 1140
    prompt_bytes: 512
    noise_level: 0.5
