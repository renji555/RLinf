<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PPO 轨迹回放</title>
<style>
:root{color-scheme:light;--bg:#f4f6f8;--surface:#fff;--fg:#172330;--muted:#5d6b79;--border:#dce2e8;--accent:#176b61;--chip:#e9f3f0}
@media(prefers-color-scheme:dark){:root{color-scheme:dark;--bg:#12191f;--surface:#1c262e;--fg:#e6edf3;--muted:#acb9c6;--border:#35424d;--accent:#8cd3bf;--chip:#243b36}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.6 system-ui,-apple-system,"Segoe UI",sans-serif}main{max-width:1240px;margin:auto;padding:32px 24px 60px}header{display:flex;justify-content:space-between;gap:24px;align-items:start}h1{font-size:28px;line-height:1.3;margin:0 0 6px;letter-spacing:-.6px}p{margin:5px 0}.muted{color:var(--muted)}.run{overflow-wrap:anywhere}.toolbar{display:flex;flex-wrap:wrap;gap:18px;align-items:end;margin:28px 0 18px}label{font-size:12px;color:var(--muted);display:block;margin-bottom:5px}select,button{font:inherit;background:var(--surface);color:var(--fg);border:1px solid var(--border);border-radius:7px;padding:9px 12px;min-height:42px}select{min-width:145px}button{cursor:pointer}button:hover{background:var(--chip)}.count{margin-left:auto;align-self:center;color:var(--muted);font-variant-numeric:tabular-nums}.group{margin:26px 0}.group h2{font-size:17px;font-weight:600;border-bottom:1px solid var(--border);padding-bottom:9px;margin-bottom:14px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(245px,1fr));gap:14px}.video{display:block;background:var(--surface);color:var(--fg);text-decoration:none;border:1px solid var(--border);border-radius:11px;padding:18px;transition:border-color .15s}.video:hover,.video:focus-visible{border-color:var(--accent)}.video h3{font-size:16px;margin:0 0 5px;font-weight:600}.video p{font-size:13px;color:var(--muted);margin:3px 0}.video .open{color:var(--accent);margin-top:13px;font-size:13px}.tag{display:inline-block;font-size:11px;color:var(--accent);background:var(--chip);padding:3px 8px;border-radius:20px;margin-bottom:10px}.empty{padding:40px 0;color:var(--muted)}footer{font-size:12px;color:var(--muted);margin-top:28px;border-top:1px solid var(--border);padding-top:14px}button:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:3px}@media(max-width:520px){main{padding:23px 16px}header{display:block}.toolbar{gap:12px}.toolbar>div{flex:1}select{width:100%;min-width:0}.count{width:100%}.grid{grid-template-columns:1fr}}
</style>
</head>
<body><main>
<header><div><h1>PPO 轨迹回放</h1><p class="muted">播放视频，检查每个动作 chunk 的 advantage、log_prob 与训练 loss。</p><p class="muted run" id="run-name"></p></div><button type="button" id="refresh">刷新列表</button></header>
<div class="toolbar"><div><label for="round">采样轮次</label><select id="round"></select></div><div><label for="seed">环境批次</label><select id="seed"></select></div><span id="count" class="count" aria-live="polite"></span></div>
<div id="videos"></div>
<footer>只列出已经完成叠字与指标导出的视频。新的采样视频会在对应轮次训练结束后加入。每段 MP4 保持原有帧率；同一 action chunk 的多帧共用一组指标。页面内可下载完整 JSON 与逐帧 CSV。</footer>
</main>
<script type="application/json" id="catalog-data">__PPO_CATALOG__</script>
<script>
(function(){'use strict';
var data=JSON.parse(document.getElementById('catalog-data').textContent),round=document.getElementById('round'),seed=document.getElementById('seed'),area=document.getElementById('videos');
function option(value,label){var el=document.createElement('option');el.value=value;el.textContent=label;return el;}
function element(tag,text,cls){var el=document.createElement(tag);if(text!==undefined)el.textContent=text;if(cls)el.className=cls;return el;}
function safePage(value){return /^(seed_[A-Za-z0-9_-]+)\/[A-Za-z0-9_.-]+\.ppo\.html$/.test(value)?value:null;}
var videos=data.videos.filter(function(v){return safePage(v.href);});
document.getElementById('run-name').textContent=data.run_name;
round.appendChild(option('all','全部轮次'));Array.from(new Set(videos.map(function(v){return v.step;}))).sort(function(a,b){return b-a;}).forEach(function(s){round.appendChild(option(String(s),'第 '+(s+1)+' 轮'));});
seed.appendChild(option('all','全部环境批次'));Array.from(new Set(videos.map(function(v){return v.seed;}))).sort(function(a,b){return a.localeCompare(b,undefined,{numeric:true});}).forEach(function(s){seed.appendChild(option(s,s));});
function render(){area.replaceChildren();var selected=videos.filter(function(v){return(round.value==='all'||String(v.step)===round.value)&&(seed.value==='all'||v.seed===seed.value);});document.getElementById('count').textContent=selected.length+' 段视频 · 共 '+videos.length+' 段';if(!selected.length){area.appendChild(element('p','还没有符合条件的视频。完成当前轮次后刷新列表。','empty'));return;}var sections=new Map();selected.forEach(function(v){var grid=sections.get(v.step);if(!grid){var section=element('section',undefined,'group');section.appendChild(element('h2','第 '+(v.step+1)+' 轮采样'));grid=element('div',undefined,'grid');section.appendChild(grid);area.appendChild(section);sections.set(v.step,grid);}var a=element('a',undefined,'video');a.href=v.href;a.appendChild(element('span','指标已记录','tag'));a.appendChild(element('h3',v.seed+' / 视频 '+v.name));a.appendChild(element('p','Rollout epoch '+v.epoch+' · Env rank '+v.env_rank));var duration=Number(v.frame_count)/Number(v.fps);a.appendChild(element('p',v.frame_count+' 帧 · '+duration.toFixed(1)+' 秒 · '+v.fps+' FPS'));a.appendChild(element('p',v.sample_count+' 个动作 chunk 样本'));a.appendChild(element('p','查看视频与逐帧指标 →','open'));grid.appendChild(a);});}
round.addEventListener('change',render);seed.addEventListener('change',render);document.getElementById('refresh').addEventListener('click',function(){location.reload();});render();
})();
</script></body></html>
