# Sync SAC training on dual-arm Franka with dual GELLO teleop and smooth intervene.
# Launch: bash examples/embodiment/run_realworld.sh realworld_dual_franka_gello_smooth_sac_cnn
defaults:
  - env/realworld_dual_franka@env.train
  - env/realworld_dual_franka@env.eval
  - model/cnn_policy@actor.model
  - training_backend/fsdp@actor.fsdp_config
  - weight_syncer/patch_syncer@weight_syncer
  - override hydra/job_logging: stdout

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

cluster:
  num_nodes: 2
  component_placement:
    actor:
      node_group: "4090"
      placement: 0
    env:
      node_group: franka
      placement: 0
    rollout:
      node_group: "4090"
      placement: 0
  node_groups:
    - label: "4090"
      node_ranks: 0-0
    - label: franka
      node_ranks: 1-1
      hardware:
        type: DualFranka
        configs:
          - left_robot_ip: LEFT_ROBOT_IP
            right_robot_ip: RIGHT_ROBOT_IP
            base_camera_serials:
              - BASE_CAMERA_SERIAL
            left_camera_serials:
              - LEFT_CAMERA_SERIAL
            right_camera_serials:
              - RIGHT_CAMERA_SERIAL
            camera_type: realsense
            left_gripper_type: robotiq
            right_gripper_type: robotiq
            left_gripper_connection: LEFT_GRIPPER_CONNECTION
            right_gripper_connection: RIGHT_GRIPPER_CONNECTION
            left_controller_node_rank: 0
            right_controller_node_rank: 1
            node_rank: 0

runner:
  task_type: embodied
  logger:
    log_path: "../results"
    project_name: rlinf
    experiment_name: "dual_franka_gello_smooth_sac"
    logger_backends: ["tensorboard"]

  max_epochs: 10
  max_steps: -1
  only_eval: False
  val_check_interval: -1
  save_interval: -1
  resume_dir: null
  ckpt_path: null

algorithm:
  update_epoch: 32
  group_size: 1
  agg_q: min
  actor_agg_q: mean
  enable_drq: False

  rollout_epoch: 1
  eval_rollout_epoch: 1

  adv_type: embodied_sac
  loss_type: embodied_sac
  loss_agg_func: "token-mean"

  bootstrap_type: always
  gamma: 0.8
  tau: 0.01

  entropy_tuning:
    alpha_type: softplus
    initial_alpha: 0.01
    target_entropy: -14  # -action_dim (14 for dual-arm with grippers)
    optim:
      lr: 3.0e-4
      lr_scheduler: torch_constant
      clip_grad: 10.0

  replay_buffer:
    enable_cache: True
    cache_size: 200
    sample_window_size: 200
    min_buffer_size: 2
    auto_save: False

  demo_buffer:
    enable_cache: True
    cache_size: 200
    min_buffer_size: 1
    sample_window_size: 200
    load_path: null
    auto_save: False

  target_update_freq: 1

  sampling_params:
    do_sample: True
    temperature_train: 1.0
    temperature_eval: 0.6
    top_k: 50
    top_p: 1.0
    repetition_penalty: 1.0

  length_params:
    max_new_token: 14
    max_length: 1024
    min_length: 1

env:
  group_name: "EnvGroup"

  train:
    auto_reset: True
    ignore_terminations: True
    total_num_envs: 1
    use_spacemouse: False
    use_gello: True
    left_gello_port: "/dev/serial/by-id/your-left-gello"
    right_gello_port: "/dev/serial/by-id/your-right-gello"
    override_cfg:
      teleop_config:
        smooth_intervene: true

  eval:
    total_num_envs: 1
    use_spacemouse: False
    use_gello: True
    left_gello_port: "/dev/serial/by-id/your-left-gello"
    right_gello_port: "/dev/serial/by-id/your-right-gello"
    override_cfg:
      teleop_config:
        smooth_intervene: false

rollout:
  group_name: "RolloutGroup"
  backend: "huggingface"
  enable_offload: False
  pipeline_stage_num: 1

  collect_transitions: True
  collect_prev_infos: False

  model:
    model_path: "/path/to/model"
    precision: ${actor.model.precision}
    num_q_heads: 10

  enable_torch_compile: True
  enable_cuda_graph: False

actor:
  group_name: "ActorGroup"
  training_backend: "fsdp"

  micro_batch_size: 256
  global_batch_size: 256
  seed: 1234
  enable_offload: False

  model:
    model_path: "/path/to/model"
  # Dual-arm delta pose + gripper per arm (7 + 7). Tune state_dim to match env obs.
    state_dim: 38
    action_dim: 14
    num_q_heads: 10

  optim:
    clip_grad: 10.0
    lr: 3e-4
    lr_scheduler: torch_constant

  critic_optim:
    clip_grad: 10.0
    lr: 3e-4
    lr_scheduler: torch_constant

  fsdp_config:
    strategy: "fsdp"
    sharding_strategy: "no_shard"
    mixed_precision:
      param_dtype: ${actor.model.precision}
      reduce_dtype: ${actor.model.precision}
      buffer_dtype: ${actor.model.precision}

reward:
  use_reward_model: False

critic:
  use_critic_model: False
