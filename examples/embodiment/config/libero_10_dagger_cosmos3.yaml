defaults:
  - env/libero_10@env.train
  - env/libero_10@env.eval
  - model/cosmos3@actor.model
  - hybrid_engines/fsdp@actor.fsdp_config
  - weight_syncer/bucket_syncer@weight_syncer
  - override hydra/job_logging: stdout
  - _self_

hydra:
  run:
    dir: .
  output_subdir: null

cluster:
  num_nodes: 1
  component_placement:
    actor: 0-3
    env: 4-7
    rollout: 4-7

runner:
  task_type: embodied
  logger:
    log_path: /mnt/public2/rhy/cosmos_rlinf/RLinf/logs/cosmos3_expert_rollout_smoke
    project_name: rlinf
    experiment_name: cosmos3_expert_rollout_smoke
    logger_backends: [tensorboard]

  max_epochs: 8000
  max_steps: -1

  only_eval: false
  val_check_interval: -1
  save_interval: 40

  resume_dir: null
  ckpt_path: /mnt/public2/rhy/cosmos_rlinf/RLinf/logs/20261020-02:30:31-libero_sft_cosmos3/libero_sft_cosmos3/checkpoints/global_step_4000/actor/model_state_dict/full_weights.pt
  expert_ckpt_path: /mnt/public2/rhy/cosmos_rlinf/RLinf/logs/20261020-15:35:02-libero_sft_cosmos3/libero_sft_cosmos3/checkpoints/global_step_8000/actor/model_state_dict/full_weights.pt

algorithm:
  reward_coef: 1.0
  
  dagger:
    init_beta: 1.0
    beta_schedule: exponential
    beta_decay: 0.999
    beta_min: 0.05
    only_save_expert: false
    online_lerobot:
      enabled: True
      only_success: True
      robot_type: "panda"
      fps: 20
      training_action_horizon: 16
      finalize_interval: 8
      data_path: /mnt/public2/rhy/cosmos_rlinf/RLinf/data/cosmos3_dagger_online
      rolling_lerobot_window_size: 50000
      lerobot_num_workers: 0
      # Start training once the rolling dataset contains this many frames.
      min_frames: 1024

  replay_buffer:
    enable_cache: true
    cache_size: 2000
    sample_window_size: 2000
    min_buffer_size: 16
    auto_save: false

  update_epoch: 4
  loss_type: embodied_dagger
  adv_type: gae
  gamma: 0.99

env:
  group_name: EnvGroup
  train:
    init_params: {ignore_done: true}
    skip_intermediate_renders: False
    rollout_epoch: 1
    total_num_envs: 16
    reward_coef: ${algorithm.reward_coef}
    max_episode_steps: 1024
    # Cover the episode horizon with complete ten-action chunks.
    max_steps_per_rollout_epoch: 520
    group_size: 1
    auto_reset: true
    ignore_terminations: false
    is_eval: false
    seed: 42
    video_cfg:
      save_video: false
  eval:
    init_params: {ignore_done: true}
    rollout_epoch: 1
    total_num_envs: 16
    auto_reset: true
    ignore_terminations: true
    max_episode_steps: 1024
    max_steps_per_rollout_epoch: 520
    group_size: 1
    is_eval: true
    video_cfg:
      save_video: false

rollout:
  group_name: RolloutGroup
  backend: huggingface
  recompute_logprobs: false
  enable_offload: false
  enable_torch_compile: false
  enable_cuda_graph: false
  pipeline_stage_num: 1
  collect_prev_infos: false
  collect_final_values: false
  model:
    model_path: /mnt/public2/rhy/docker_dev/update/model/Cosmos3-Nano-DCP
    action_model_mode: policy
    sft_objective: action_only
    precision: ${actor.model.precision}
    load_to_device: true
    ema_enabled: false
  expert_model:
    model_path: /mnt/public2/rhy/docker_dev/update/model/Cosmos3-Nano-DCP
    precision: ${actor.model.precision}
    load_to_device: true
    ema_enabled: false
    action_model_mode: wam
    sft_objective: joint

actor:
  group_name: ActorGroup
  model:
    model_path: /mnt/public2/rhy/docker_dev/update/model/Cosmos3-Nano-DCP
    action_model_mode: policy
    sft_objective: action_only
    num_inference_steps: 30
  training_backend: fsdp
  micro_batch_size: 1
  global_batch_size: 32
  seed: 1234
  enable_offload: true
  optim:
    lr: 1e-5
    value_lr: 1.0e-4
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-08
    weight_decay: 1e-10
    clip_grad: 5.0
    warmup_style: "cosine"
    lr_warmup_steps: 20
    total_training_steps: 8000

  fsdp_config:
    strategy: "fsdp"
    sharding_strategy: "full_shard"
    use_orig_params: true
    gradient_checkpointing: False
    # Synchronize each microbatch so accumulated gradients stay sharded.
    enable_gradient_accumulation: false
    limit_all_gathers: true
    mixed_precision:
      param_dtype: ${actor.model.precision}
      reduce_dtype: ${actor.model.precision}
      buffer_dtype: null
      cast_forward_inputs: false
      cast_root_forward_inputs: false

reward:
  use_reward_model: false

critic:
  use_critic_model: false
